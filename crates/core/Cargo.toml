[package]
name = "relayless-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Relayless transfer engine: direct encrypted peer-to-peer, resumable, verified"

[dependencies]
iroh = "1.4"
noq-proto = "1.4"
n0-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1.8"
rand = "0.10"
data-encoding = "2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
argon2 = "0.5"
chacha20poly1305 = "0.11"
fs4 = { version = "0.13", features = ["sync"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
# Local rate-limited relay server for the relay-path tests (tests/relay.rs).
iroh-relay = { version = "1.4.1", features = ["server", "test-utils"] }
# Emulated lossy path for the multi-connection tests (tests/multiconn.rs).
iroh = { version = "1.4", features = ["unstable-custom-transports"] }
noq-udp = "1.4"
n0-watcher = "1"
bytes = "1"
iroh-base = "1.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
