name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-tests-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-linux
      - name: Unit and end-to-end transfer tests
        run: cargo test -p relayless-core --release

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Core tests on Windows (file I/O, locking, transfers)
        run: cargo test -p relayless-core --release

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Collect installer
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dest = "Relayless-Setup-$ver-x64.exe"
          Copy-Item $exe.FullName $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          "$hash  $dest" | Out-File -Encoding ascii "$dest.sha256"
          "file=$dest" >> $env:GITHUB_OUTPUT
          Write-Host "Built $dest ($([math]::Round((Get-Item $dest).Length / 1MB, 1)) MB) sha256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: Relayless-Windows-installer
          path: |
            ${{ steps.out.outputs.file }}
            ${{ steps.out.outputs.file }}.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.out.outputs.file }}
            ${{ steps.out.outputs.file }}.sha256
          generate_release_notes: true
          body: |
            ## Install
            Download **${{ steps.out.outputs.file }}** below and run it. No administrator rights needed.

            Windows SmartScreen may warn because the installer isn't code-signed yet: click **More info → Run anyway**.
