name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-tests-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-linux
      - name: Unit and end-to-end transfer tests
        shell: bash
        run: .github/scripts/run.sh cargo test -p relayless-core --release -- --test-threads=1

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Core tests on Windows (file I/O, locking, transfers)
        shell: bash
        run: .github/scripts/run.sh cargo test -p relayless-core --release -- --test-threads=1

      - name: Build installer
        shell: bash
        run: .github/scripts/run.sh npx tauri build --bundles nsis

      - name: Collect installer
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dest = "Relayless-Setup-$ver-x64.exe"
          Copy-Item $exe.FullName $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          "$hash  $dest" | Out-File -Encoding ascii "$dest.sha256"
          "file=$dest" >> $env:GITHUB_OUTPUT
          Write-Host "Built $dest ($([math]::Round((Get-Item $dest).Length / 1MB, 1)) MB) sha256=$hash"

      - name: Smoke test (install silently, launch, check engine starts)
        shell: pwsh
        run: |
          $setup = "${{ steps.out.outputs.file }}"
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -PassThru -Wait
          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Host "::error title=Smoke test::Installer exited with $($p.ExitCode)"; exit 1 }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Relayless" -Recurse -Filter "Relayless.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Relayless.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $exe) { Write-Host "::error title=Smoke test::Installed Relayless.exe not found"; exit 1 }
          Write-Host "Installed at $($exe.FullName)"
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          $log = Join-Path $env:APPDATA "app.relayless.desktop\logs\relayless.log"
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          Write-Host "---- app log ----"; Write-Host $text
          $alive = -not $app.HasExited
          $mem = if ($alive) { [math]::Round((Get-Process -Id $app.Id).WorkingSet64 / 1MB, 1) } else { 0 }
          Write-Host "Process alive: $alive, working set: $mem MB"
          # A second launch must hand over to the running instance and exit.
          $second = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 6
          $secondExited = $second.HasExited
          Write-Host "Second instance exited (single-instance handoff): $secondExited"
          Get-Process -Name "Relayless" -ErrorAction SilentlyContinue | Stop-Process -Force
          $ok = $alive -and ($text -match "started as") -and $secondExited
          $summary = "alive=$alive started=$($text -match 'started as') secondExited=$secondExited ws=${mem}MB"
          if (-not $ok) {
            $enc = ($text -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
            Write-Host "::error title=Smoke test failed ($summary)::$enc"
            exit 1
          }
          Write-Host "::notice title=Smoke test passed::$summary"

      - uses: actions/upload-artifact@v4
        with:
          name: Relayless-Windows-installer
          path: |
            ${{ steps.out.outputs.file }}
            ${{ steps.out.outputs.file }}.sha256
          if-no-files-found: error

      - name: Attach installer to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            ${{ steps.out.outputs.file }}
            ${{ steps.out.outputs.file }}.sha256
          generate_release_notes: ${{ github.event_name != 'release' }}
          append_body: true
          body: |
            ## Install
            Download **${{ steps.out.outputs.file }}** below and run it. No administrator rights needed.

            Windows SmartScreen may warn because the installer isn't code-signed yet: click **More info → Run anyway**.

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          NDK=$(sdkmanager --list 2>/dev/null | grep -oE "ndk;[0-9]+\.[0-9]+\.[0-9]+" | sort -u -t';' -k2 -V | tail -1)
          echo "Installing $NDK"
          yes | sdkmanager "$NDK" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK#ndk;}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Install frontend dependencies
        run: npm ci

      - name: Signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > relayless.jks
            PASS="$KEYSTORE_PASSWORD"
            echo "::notice title=APK signing::Signed with the repository's release key"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore relayless.jks -alias relayless -keyalg RSA -keysize 4096 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Relayless" > /dev/null 2>&1
            echo "::warning title=Temporary APK signing key::No ANDROID_KEYSTORE_BASE64 secret is set, so this APK is signed with a one-off key. Installing a later build over it will require uninstalling first. See README (Android signing)."
          fi
          printf 'storeFile=relayless.jks\nstorePassword=%s\nkeyAlias=relayless\nkeyPassword=%s\n' "$PASS" "$PASS" > keystore.properties

      - name: Build APKs
        shell: bash
        run: .github/scripts/run.sh npx tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64

      - name: Collect APKs
        id: apk
        shell: bash
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -print
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk"); do
            case "$f" in
              *arm64*) abi=arm64 ;;
              *armeabi*|*arm-*|*/arm/*) abi=armv7 ;;
              *x86_64*) abi=x86_64 ;;
              *) abi=universal ;;
            esac
            cp "$f" "out/Relayless-$ver-android-$abi.apk"
          done
          (cd out && sha256sum *.apk > SHA256SUMS.txt && ls -la)
          echo "x86=$(ls out/*x86_64.apk)" >> "$GITHUB_OUTPUT"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android emulator (install, launch, engine starts)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r ${{ steps.apk.outputs.x86 }}
            adb logcat -c
            adb shell monkey -p app.relayless -c android.intent.category.LAUNCHER 1
            sleep 45
            bash .github/scripts/android-smoke.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Relayless-Android-APKs
          path: out/*
          if-no-files-found: error

      - name: Attach APKs to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: out/*
