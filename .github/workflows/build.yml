name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".github/workflows/website.yml"
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".github/workflows/website.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-tests-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-linux
      - name: Unit and end-to-end transfer tests
        shell: bash
        run: .github/scripts/run.sh cargo test -p relayless-core --release -- --test-threads=1

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Core tests on Windows (file I/O, locking, transfers)
        shell: bash
        run: .github/scripts/run.sh cargo test -p relayless-core --release -- --test-threads=1

      - name: Build installer
        shell: bash
        run: .github/scripts/run.sh npx tauri build --bundles nsis

      - name: Collect installer
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dest = "Relayless-Setup-$ver-x64.exe"
          Copy-Item $exe.FullName $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          "$hash  $dest" | Out-File -Encoding ascii "$dest.sha256"
          "file=$dest" >> $env:GITHUB_OUTPUT
          Write-Host "Built $dest ($([math]::Round((Get-Item $dest).Length / 1MB, 1)) MB) sha256=$hash"

      - name: Smoke test (install silently, launch, check engine starts)
        shell: pwsh
        run: |
          $setup = "${{ steps.out.outputs.file }}"
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -PassThru -Wait
          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Host "::error title=Smoke test::Installer exited with $($p.ExitCode)"; exit 1 }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Relayless" -Recurse -Filter "Relayless.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Relayless.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $exe) { Write-Host "::error title=Smoke test::Installed Relayless.exe not found"; exit 1 }
          Write-Host "Installed at $($exe.FullName)"
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          $log = Join-Path $env:APPDATA "app.relayless.desktop\logs\relayless.log"
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          Write-Host "---- app log ----"; Write-Host $text
          $alive = -not $app.HasExited
          $mem = if ($alive) { [math]::Round((Get-Process -Id $app.Id).WorkingSet64 / 1MB, 1) } else { 0 }
          Write-Host "Process alive: $alive, working set: $mem MB"
          # A second launch must hand over to the running instance and exit.
          $second = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 6
          $secondExited = $second.HasExited
          Write-Host "Second instance exited (single-instance handoff): $secondExited"
          Get-Process -Name "Relayless" -ErrorAction SilentlyContinue | Stop-Process -Force
          $ok = $alive -and ($text -match "started as") -and $secondExited
          $summary = "alive=$alive started=$($text -match 'started as') secondExited=$secondExited ws=${mem}MB"
          if (-not $ok) {
            $enc = ($text -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
            Write-Host "::error title=Smoke test failed ($summary)::$enc"
            exit 1
          }
          Write-Host "::notice title=Smoke test passed::$summary"

      - uses: actions/upload-artifact@v4
        with:
          name: Relayless-Windows-installer
          path: |
            ${{ steps.out.outputs.file }}
            ${{ steps.out.outputs.file }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build${{ github.run_number }}
          name: Relayless 0.1.0 (build ${{ github.run_number }})
          body_path: .github/release-notes.md
          make_latest: true
          files: |
            ${{ steps.out.outputs.file }}
            ${{ steps.out.outputs.file }}.sha256

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK and NDK
        shell: bash
        run: |
          set -e
          trap 'echo "::error title=Android SDK setup failed at line $LINENO::$BASH_COMMAND"' ERR
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || ! ls "$SDK"/cmdline-tools/*/bin/sdkmanager > /dev/null 2>&1; then
            echo "No preinstalled Android SDK; downloading command-line tools"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSLo /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              || { echo "::error title=Android SDK::Could not download Android command-line tools"; exit 1; }
            unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          BIN=$(ls -d "$SDK"/cmdline-tools/*/bin | sort -V | tail -1)
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$BIN" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$BIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "$SDK"/ndk/*/ 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$NDK_DIR" ]; then
            NDK=$("$BIN/sdkmanager" --list 2>/dev/null | grep -oE "ndk;[0-9]+\.[0-9]+\.[0-9]+" | sort -u -t';' -k2 -V | tail -1)
            echo "Installing $NDK"
            yes | "$BIN/sdkmanager" --install "$NDK" "platform-tools" | tail -5
            NDK_DIR="$SDK/ndk/${NDK#ndk;}"
          fi
          echo "NDK_HOME=${NDK_DIR%/}" >> "$GITHUB_ENV"
          echo "::notice title=Android toolchain::SDK $SDK, NDK ${NDK_DIR%/}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Install frontend dependencies
        run: npm ci

      # Keep the same signing key across runs so new builds install over old ones.
      - uses: actions/cache@v4
        with:
          path: ~/.relayless-signing
          key: relayless-signing-key-v1

      - name: Signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          K=~/.relayless-signing
          mkdir -p "$K"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$K/relayless.jks"
            printf '%s' "$KEYSTORE_PASSWORD" > "$K/pass"
            echo "::notice title=APK signing::Signed with the repository's release key"
          elif [ ! -f "$K/relayless.jks" ]; then
            openssl rand -hex 16 | tr -d '\n' > "$K/pass"
            keytool -genkeypair -keystore "$K/relayless.jks" -storetype PKCS12 -alias relayless -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$(cat "$K/pass")" -keypass "$(cat "$K/pass")" \
              -dname "CN=Relayless, OU=Relayless, O=Relayless, L=Dhaka, C=BD" > /dev/null 2>&1
            echo "::notice title=APK signing::Created a new signing key; later builds reuse it"
          else
            echo "::notice title=APK signing::Reusing the cached signing key"
          fi
          cp "$K/relayless.jks" src-tauri/gen/android/relayless.jks
          PASS=$(cat "$K/pass")
          printf 'storeFile=relayless.jks\nstorePassword=%s\nkeyAlias=relayless\nkeyPassword=%s\n' "$PASS" "$PASS" > src-tauri/gen/android/keystore.properties

      - name: Build APKs
        shell: bash
        run: .github/scripts/run.sh npx tauri android build --apk --target aarch64 armv7 x86_64 --config '{"bundle":{"android":{"versionCode":${{ github.run_number }}}}}'

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -print
          f=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          [ -n "$f" ] || { echo "::error title=APK::No release APK found"; exit 1; }
          name="Relayless-$ver-build${{ github.run_number }}-android.apk"
          cp "$f" "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256" && ls -la)
          echo "apk=out/$name" >> "$GITHUB_OUTPUT"

      - name: Inspect APKs (signature, SDK levels, ABIs)
        shell: bash
        run: bash .github/scripts/apk-inspect.sh

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android emulator (install, launch, engine starts)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r ${{ steps.apk.outputs.apk }}
            adb logcat -c
            adb shell monkey -p app.relayless -c android.intent.category.LAUNCHER 1
            sleep 45
            bash .github/scripts/android-smoke.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Relayless-Android-APK
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build${{ github.run_number }}
          name: Relayless 0.1.0 (build ${{ github.run_number }})
          body_path: .github/release-notes.md
          files: out/*
          make_latest: true
