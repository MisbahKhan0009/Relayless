name: Compare APK with AURA

on:
  push:
    branches: [main]
    paths: [".github/workflows/compare-aura.yml"]

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - name: Download both latest APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apks
          gh release download -R MisbahKhan0009/launcher -p "*universal.apk" -D apks
          gh release download -R ${{ github.repository }} -p "*android.apk" -D apks
          ls -la apks
      - name: Inspect
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          out=""
          for apk in apks/*.apk; do
            n=$(basename "$apk")
            s=$("$BT/apksigner" verify --verbose --print-certs "$apk" 2>&1 | grep -E "Verifies|v1 scheme|v2 scheme|v3 scheme|Signer #1 certificate DN|key algorithm|key size|WARNING|ERROR|DOES NOT")
            b=$("$BT/aapt2" dump badging "$apk" 2>&1 | grep -E "^package:|[sS]dkVersion|native-code|uses-permission|ERROR")
            x=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" 2>&1 | grep -E "extractNativeLibs|testOnly|debuggable|sharedUserId|installLocation|requestLegacy|foregroundServiceType|E: (service|provider|receiver|property)" )
            z=$(unzip -lv "$apk" | grep -E "\.so$" | awk '{print $2, $8}' | head -8)
            zc=$("$BT/zipalign" -c -P 16 -v 4 "$apk" 2>&1 | tail -2)
            block="### $n ($(du -h "$apk" | cut -f1))
          SIGNING:
          $s
          BADGING:
          $b
          MANIFEST:
          $x
          NATIVE LIBS (method name):
          $z
          ZIPALIGN: $zc"
            echo "$block"
            out+="$block

          "
          done
          echo "::notice title=APK comparison::$(echo "$out" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
