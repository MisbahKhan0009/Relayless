[package]
name = "tauri-plugin-relayless-android"
version = "0.1.0"
authors = ["Relayless"]
description = "Android integration for Relayless: storage access, background transfer service, device info"
edition = "2021"
links = "tauri-plugin-relayless-android"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
