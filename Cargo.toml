[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Misbah Khan"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# Hashing and crypto are hot paths during transfers; keep them optimized in dev too.
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
